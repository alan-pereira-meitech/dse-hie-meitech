<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE JetBus Web UI</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #1f2a3a, #0b0f18 70%);
    }
    header {
      padding: 1.5rem 2rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: 0.05em;
      color: #4fc3f7;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      padding: 2rem;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    section {
      background: rgba(15, 23, 42, 0.75);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(79, 195, 247, 0.15);
    }
    .connection-controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(224, 224, 224, 0.8);
    }
    input[type="text"] {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(79, 195, 247, 0.25);
      background: rgba(15, 23, 42, 0.6);
      color: #e0f7fa;
      font-size: 0.95rem;
    }
    input[type="text"]:focus {
      outline: 2px solid rgba(79, 195, 247, 0.6);
      box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.25);
    }
    button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      color: #0b0f18;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(79, 195, 247, 0.35);
    }
    button.secondary {
      background: rgba(55, 65, 81, 0.85);
      color: #e5e7eb;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .status-indicator.connected {
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35);
    }
    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .live-weights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }
    .weight-card {
      background: rgba(15, 23, 42, 0.75);
      border-radius: 18px;
      padding: 1.5rem;
      border: 1px solid rgba(79, 195, 247, 0.25);
      box-shadow: inset 0 0 0 1px rgba(79, 195, 247, 0.05);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .weight-card .metric-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(224, 242, 254, 0.75);
    }
    .weight-card .metric-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #a5f3fc;
    }
    .weight-unit {
      font-size: 0.95rem;
      color: rgba(165, 243, 252, 0.8);
      letter-spacing: 0.05em;
    }
    .weight-status {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(148, 163, 184, 0.8);
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.65);
      padding: 1rem;
      border-radius: 14px;
      border: 1px solid rgba(79, 195, 247, 0.15);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(226, 232, 240, 0.7);
    }
    .metric-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #80eaff;
    }
    .functions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .functions h3 {
      margin: 0;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(148, 197, 253, 0.85);
    }
    .function-card {
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(12, 18, 32, 0.8);
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .function-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(79, 195, 247, 0.2);
      color: #4fc3f7;
    }
    .inputs {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .result {
      font-family: "Fira Code", monospace;
      font-size: 0.85rem;
      color: #cbd5f5;
      word-break: break-word;
    }
    footer {
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.8);
    }
  </style>
</head>
<body>
  <header>
    <h1>DSE JetBus Controle Web</h1>
  </header>
  <main>
    <section>
      <div class="connection-controls">
        <div class="status-dot">
          <span id="status-indicator" class="status-indicator"></span>
          <span id="status-text">Desconectado</span>
        </div>
        <label for="url">URL do JetBus</label>
        <input type="text" id="url" value="ws://127.0.0.1/jet/canopen" placeholder="ws://192.168.1.100/jet/canopen" />
        <div style="display:flex; gap:0.75rem; flex-wrap: wrap;">
          <button id="connect-btn">Conectar</button>
          <button id="disconnect-btn" class="secondary">Desconectar</button>
        </div>
        <p id="message" style="min-height:1.2rem; margin:0; color:#fbbf24;"></p>
      </div>
    </section>
    <section>
      <h2>Dados de Processo</h2>
      <div class="live-weights">
        <div class="weight-card">
          <span class="metric-label">Net Weight</span>
          <span class="metric-value" id="net-weight-value">—</span>
          <span class="weight-unit" id="net-weight-unit"></span>
          <span class="weight-status" id="net-weight-status">aguardando stream...</span>
        </div>
        <div class="weight-card">
          <span class="metric-label">Gross Weight</span>
          <span class="metric-value" id="gross-weight-value">—</span>
          <span class="weight-unit" id="gross-weight-unit"></span>
          <span class="weight-status" id="gross-weight-status">aguardando stream...</span>
        </div>
      </div>
      <div class="process-grid" id="status-grid"></div>
    </section>
    <section style="grid-column: 1 / -1;">
      <h2>Funções disponíveis</h2>
      <div class="functions" id="functions"></div>
    </section>
  </main>
  <footer>
    Desenvolvido em TypeScript + Node.js. Interface gerada automaticamente a partir de <code>device.hpp</code>.
  </footer>
  <script>
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const messageBox = document.getElementById('message');
    const statusGrid = document.getElementById('status-grid');
    const functionsContainer = document.getElementById('functions');
    const urlInput = document.getElementById('url');
    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const netWeightValue = document.getElementById('net-weight-value');
    const netWeightUnit = document.getElementById('net-weight-unit');
    const netWeightStatus = document.getElementById('net-weight-status');
    const grossWeightValue = document.getElementById('gross-weight-value');
    const grossWeightUnit = document.getElementById('gross-weight-unit');
    const grossWeightStatus = document.getElementById('gross-weight-status');

    let refreshTimer = null;
    let metadata = [];
    let weightSocket = null;
    let weightReconnectTimer = null;

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || response.statusText);
      }
      return response.json();
    }

    function setStatus(connected) {
      statusIndicator.classList.toggle('connected', connected);
      statusText.textContent = connected ? 'Conectado' : 'Desconectado';
      if (!connected) {
        statusGrid.innerHTML = '';
        updateLiveWeights({ connected: false });
      }
    }

    function updateLiveWeights(payload) {
      if (!payload || !payload.connected) {
        netWeightValue.textContent = '—';
        netWeightUnit.textContent = '';
        netWeightStatus.textContent = 'stream inativo';
        grossWeightValue.textContent = '—';
        grossWeightUnit.textContent = '';
        grossWeightStatus.textContent = 'stream inativo';
        return;
      }
      const unit = payload.unit ? ` ${payload.unit}` : '';
      const statusTextValue = payload.stable ? 'peso estável' : 'peso em movimento';
      netWeightValue.textContent = payload.net ?? '—';
      netWeightUnit.textContent = unit;
      netWeightStatus.textContent = statusTextValue;
      grossWeightValue.textContent = payload.gross ?? '—';
      grossWeightUnit.textContent = unit;
      grossWeightStatus.textContent = statusTextValue;
    }

    function renderProcessData(snapshot) {
      if (!snapshot || !snapshot.connected) {
        statusGrid.innerHTML = '<p>Nenhum dado disponível.</p>';
        return;
      }
      const data = snapshot.processData;
      const entries = [
        { label: 'Tare', value: `${data.printableWeight.tare} ${data.unit}` },
        { label: 'Unidade', value: data.unit || '—' },
        { label: 'Decimais', value: data.decimals },
        { label: 'Modo de Tara', value: data.tareMode },
        { label: 'Peso Estável', value: data.weightStable ? 'Sim' : 'Não' },
        { label: 'Zero Requerido', value: data.zeroRequired ? 'Sim' : 'Não' },
        { label: 'Centro do Zero', value: data.centerOfZero ? 'Sim' : 'Não' },
        { label: 'Dentro do Zero', value: data.insideZero ? 'Sim' : 'Não' },
        { label: 'Legal para Uso', value: data.legalForTrade ? 'Sim' : 'Não' },
        { label: 'Subcarga', value: data.underload ? 'Sim' : 'Não' },
        { label: 'Sobrecarga', value: data.overload ? 'Sim' : 'Não' },
        { label: 'Limite Seguro', value: data.higherSafeLoadLimit ? 'Acima' : 'OK' },
        { label: 'Erro Geral', value: data.generalScaleError ? 'Sim' : 'Não' },
        { label: 'Alarme', value: data.scaleAlarm ? 'Ativo' : 'Normal' }
      ];
      statusGrid.innerHTML = entries.map(entry => `
        <div class="metric-card">
          <span class="metric-label">${entry.label}</span>
          <span class="metric-value">${entry.value}</span>
        </div>
      `).join('');
    }

    function createFunctionCard(meta, actionLabel) {
      const card = document.createElement('div');
      card.className = 'function-card';

      const header = document.createElement('div');
      header.className = 'function-header';
      const title = document.createElement('h4');
      title.textContent = meta.label;
      title.style.margin = '0';
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = meta.kind;
      header.appendChild(title);
      header.appendChild(badge);
      card.appendChild(header);

      const description = document.createElement('p');
      description.textContent = meta.description;
      description.style.margin = '0';
      description.style.color = 'rgba(226, 232, 240, 0.8)';
      card.appendChild(description);

      const form = document.createElement('form');
      form.dataset.name = meta.name;
      form.className = 'function-form';

      if (meta.inputs && meta.inputs.length) {
        const inputsContainer = document.createElement('div');
        inputsContainer.className = 'inputs';
        meta.inputs.forEach(input => {
          const wrapper = document.createElement('label');
          wrapper.textContent = input.label;
          wrapper.style.display = 'flex';
          wrapper.style.flexDirection = 'column';
          wrapper.style.gap = '0.35rem';
          const field = document.createElement('input');
          field.type = input.type === 'number' ? 'number' : 'text';
          field.name = input.name;
          field.placeholder = input.placeholder || '';
          field.required = true;
          field.style.padding = '0.65rem 0.85rem';
          field.style.borderRadius = '10px';
          field.style.border = '1px solid rgba(79, 195, 247, 0.25)';
          field.style.background = 'rgba(15, 23, 42, 0.6)';
          field.style.color = '#e0f7fa';
          wrapper.appendChild(field);
          inputsContainer.appendChild(wrapper);
        });
        form.appendChild(inputsContainer);
      }

      const runButton = document.createElement('button');
      runButton.type = 'submit';
      runButton.textContent = actionLabel;
      form.appendChild(runButton);

      const result = document.createElement('div');
      result.className = 'result';
      result.textContent = '—';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const payload = {};
          if (meta.inputs) {
            meta.inputs.forEach(input => {
              const value = form.elements[input.name].value;
              payload[input.name] = value;
            });
          }
          const response = await fetchJson(`/api/device/functions/${meta.name}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          result.textContent = response.result === null || response.result === undefined
            ? 'OK'
            : JSON.stringify(response.result);
        } catch (error) {
          result.textContent = `Erro: ${error.message}`;
        }
      });

      card.appendChild(form);
      card.appendChild(result);
      return card;
    }

    function renderFunctions() {
      functionsContainer.innerHTML = '';
      const configFunctions = metadata.filter(meta => meta.kind === 'setter');
      const commandFunctions = metadata.filter(meta => meta.kind === 'command');

      if (configFunctions.length) {
        const configHeader = document.createElement('h3');
        configHeader.textContent = 'Parâmetros de Configuração';
        functionsContainer.appendChild(configHeader);
        configFunctions.forEach(meta => {
          const card = createFunctionCard(meta, 'Aplicar');
          functionsContainer.appendChild(card);
        });
      }

      if (commandFunctions.length) {
        const commandHeader = document.createElement('h3');
        commandHeader.textContent = 'Funções Operacionais';
        commandHeader.style.marginTop = '1.5rem';
        functionsContainer.appendChild(commandHeader);
        commandFunctions.forEach(meta => {
          const card = createFunctionCard(meta, 'Executar');
          functionsContainer.appendChild(card);
        });
      }
    }

    async function updateProcessData() {
      try {
        const snapshot = await fetchJson('/api/device/status');
        setStatus(snapshot.connected);
        renderProcessData(snapshot);
      } catch (error) {
        messageBox.textContent = error.message;
      }
    }

    function scheduleWeightReconnect() {
      if (weightReconnectTimer) {
        return;
      }
      weightReconnectTimer = setTimeout(() => {
        weightReconnectTimer = null;
        openWeightStream();
      }, 2000);
    }

    function openWeightStream() {
      if (weightSocket && (weightSocket.readyState === WebSocket.OPEN || weightSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${protocol}://${window.location.host}/process`);
      socket.addEventListener('open', () => {
        if (weightReconnectTimer) {
          clearTimeout(weightReconnectTimer);
          weightReconnectTimer = null;
        }
      });
      socket.addEventListener('message', (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === 'weight') {
            updateLiveWeights(payload);
          }
        } catch (error) {
          console.error('Erro ao processar stream', error);
        }
      });
      socket.addEventListener('close', () => {
        if (weightSocket === socket) {
          weightSocket = null;
          scheduleWeightReconnect();
        }
      });
      socket.addEventListener('error', () => {
        socket.close();
      });
      weightSocket = socket;
    }

    connectBtn.addEventListener('click', async () => {
      try {
        messageBox.textContent = 'Conectando...';
        const url = urlInput.value.trim() || urlInput.placeholder;
        await fetchJson('/api/device/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        setStatus(true);
        messageBox.textContent = 'Conectado com sucesso.';
        if (refreshTimer) clearInterval(refreshTimer);
        await updateProcessData();
        refreshTimer = setInterval(updateProcessData, 2000);
      } catch (error) {
        messageBox.textContent = error.message;
        setStatus(false);
      }
    });

    disconnectBtn.addEventListener('click', async () => {
      try {
        await fetchJson('/api/device/disconnect', { method: 'POST' });
        setStatus(false);
        messageBox.textContent = 'Desconectado.';
        if (refreshTimer) clearInterval(refreshTimer);
      } catch (error) {
        messageBox.textContent = error.message;
      }
    });

    async function bootstrap() {
      try {
        metadata = await fetchJson('/api/device/functions');
        renderFunctions();
        await updateProcessData();
      } catch (error) {
        console.error(error);
      }
    }

    openWeightStream();
    bootstrap();
  </script>
</body>
</html>
