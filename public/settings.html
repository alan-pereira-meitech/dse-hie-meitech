<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSE JetBus | Ações e Configurações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              midnight: "#0f172a"
            },
            boxShadow: {
              "brand-lg": "0 12px 30px rgba(56, 189, 248, 0.35)"
            }
          }
        }
      };
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.25), transparent 55%),
          radial-gradient(circle at top right, rgba(99, 102, 241, 0.25), transparent 55%),
          #0f172a;
        min-height: 100vh;
      }
      header {
        padding: 2.5rem 1.5rem 1.5rem;
        text-align: center;
      }
      header h1 {
        margin: 0 0 0.5rem;
        font-size: 2.3rem;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        opacity: 0.75;
      }
      main {
  max-width: 100vw;
  margin: 0;
  padding: 0 0 3rem 0;
  display: grid;
  gap: 1.75rem;
      }
      .panel {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
      }
      section {
        display: grid;
        gap: 1.5rem;
      }
      h2 {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.4rem;
      }
      .metrics {
        display: grid;
        gap: 1.2rem;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .metric-card {
        background: rgba(148, 163, 184, 0.1);
        border-radius: 16px;
        padding: 1rem;
        display: grid;
        gap: 0.35rem;
      }
      .metric-card h3 {
        margin: 0;
        font-size: 0.95rem;
        opacity: 0.75;
      }
      .metric-value {
        font-size: 2.1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .metric-unit {
        font-size: 0.9rem;
        opacity: 0.65;
      }
      .status-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1.25rem;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.65);
        font-size: 0.85rem;
        letter-spacing: 0.01em;
        transition: all 0.15s ease;
      }
      .status-pill.active {
        background: rgba(56, 189, 248, 0.16);
        border-color: rgba(56, 189, 248, 0.45);
        color: #38bdf8;
        box-shadow: 0 10px 24px rgba(56, 189, 248, 0.25);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Painel de Ações</h1>
      <p>Execute comandos JetBus, ajuste parâmetros e acompanhe os resultados em tempo real.</p>
      <p style="margin-top:0.75rem; font-size:0.9rem; opacity:0.65;">
        <a href="/" style="color:#38bdf8; text-decoration:none;">&larr; Voltar para o Dashboard</a>
      </p>
    </header>
    <main>
      <section id="actions-section">
        <div class="panel" style="gap:1.5rem; display:flex; flex-direction:column;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
            <h2>Ações e Configurações</h2>
            <span style="opacity:0.7; font-size:0.9rem;">Clique em qualquer comando para enviar ao dispositivo.</span>
          </div>
          <div class="grid gap-6 lg:grid-cols-[minmax(0,2fr)_minmax(260px,1fr)]">
            <div id="actions-container" class="grid gap-4 sm:grid-cols-2"></div>
            <div class="flex flex-col gap-4">
              <div class="rounded-2xl border border-slate-500/40 bg-slate-900/65 p-4 h-full overflow-auto" id="log-panel">
                <p style="opacity:0.6;">Logs das ações aparecerão aqui.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
